[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ebay"
version = "0.1.0"
description = "Read-only eBay deal-hunting data for Claude over the Model Context Protocol: listing search, listing details and comparables price statistics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luke Nielsen", email = "luke.nielsen@radiusgroup.us" }]
keywords = [
    "ebay",
    "mcp",
    "marketplace",
    "price-analysis",
    "claude",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "fastmcp>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/luke-nielsen/ebay-mcp"
Repository = "https://github.com/luke-nielsen/ebay-mcp"

[project.scripts]
mcp-ebay = "ebay_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ebay_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
